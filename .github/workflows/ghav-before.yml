name: "ghav before: Test Suite"
"on":
  push:
    branches:
      - ghav/dev/3438
    paths:
      - .ghav/before
env:
  BUN_VERSION: 1.4.2
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-tests: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Decide whether tests are needed
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.after || github.event.pull_request.head.sha }}
        run: |
          run_tests=$(bun scripts/should-run-test-suite.ts "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
          echo "run-tests=$run_tests" >> "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: "'true' == 'true'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
      - name: Cache Bun dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Warm uv
        if: runner.os == 'Windows'
        run: uv run python -c "print('uv warm')"
      - name: Validate
        run: bun run validate
  schema-upgrade:
    needs: changes
    if: "'true' == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Ensure psql is available
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: "ghav: keep the release tags of 2026-09-23"
        run: |
          # Upstream ran this job on 2026-09-23 (runs 35862972763 and 35873937031), before v0.11.0 and v0.11.1
          # (2026-09-25). Both checks below take their baselines from `git tag`, so keep exactly the tags of that date.
          keep="v0.1.0 v0.2.13 v0.3.0 v0.3.1 v0.3.2 v0.3.3 v0.3.4 v0.3.5 v0.3.6 v0.3.7 v0.3.8 v0.3.9 v0.3.10 v0.3.11 v0.3.12 v0.4.0 v0.4.1 v0.5.0 v0.6.0 v0.7.0 v0.7.1 v0.8.0 v0.9.0 v0.10.0 v0.10.1"
          for t in $(git tag -l); do
            case " $keep " in *" $t "*) ;; *) git tag -d "$t" ;; esac
          done
          missing=""
          for t in $keep; do
            git rev-parse -q --verify "refs/tags/$t" >/dev/null || missing="$missing +refs/tags/$t:refs/tags/$t"
          done
          if [ -n "$missing" ]; then
            git fetch --no-tags https://github.com/coleam00/Archon.git $missing
          fi
          echo "$(git tag -l | wc -l) release tags"
      - name: Upgrade from released schemas
        run: bun run check:schema-upgrades
      - name: Check SQLite vintage fixtures
        run: bun run check:sqlite-vintages
  postgres-parity:
    needs: changes
    if: "'true' == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Postgres parity test
        env:
          ARCHON_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun test packages/core/src/db/isolation-environments.live-run.postgres.integration.test.ts
  docker-build:
    needs: changes
    if: "'true' == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: archon-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — container starts and serves /api/health
        run: |
          docker run -d --name archon-smoke -e PORT=3000 -e CLAUDE_USE_GLOBAL_AUTH=true -p 3000:3000 archon-ci:test
          sleep 5
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/health
      - name: Dump container logs on failure
        if: failure()
        run: docker logs archon-smoke 2>&1 || true
      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f archon-smoke || true
  test-suite:
    name: Test Suite
    needs:
      - changes
      - test
      - schema-upgrade
      - postgres-parity
      - docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report test-suite outcome
        env:
          RUN_TESTS: ${{ 'true' }}
          TEST: ${{ needs.test.result }}
          SCHEMA_UPGRADE: ${{ needs.schema-upgrade.result }}
          POSTGRES_PARITY: ${{ needs.postgres-parity.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
        run: |
          if [ "$RUN_TESTS" = false ]; then
            echo "Skipped tests for documentation-only changes."
            exit 0
          fi

          for result in "$TEST" "$SCHEMA_UPGRADE" "$POSTGRES_PARITY" "$DOCKER_BUILD"; do
            if [ "$result" != success ]; then
              echo "A test-suite job finished with $result."
              exit 1
            fi
          done
